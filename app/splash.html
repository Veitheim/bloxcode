<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Bloxcode</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: #e8e8ea;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      position: absolute; inset: 0;
      border-radius: 14px;
      background:
        radial-gradient(260px 180px at 50% 0%, rgba(56, 132, 255, .35), transparent 70%),
        radial-gradient(200px 160px at 85% 90%, rgba(143, 107, 255, .18), transparent 70%),
        #111318;
      border: 1px solid rgba(255, 255, 255, .08);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo { width: 84px; height: 84px; filter: drop-shadow(0 10px 26px rgba(40, 120, 255, .55)); animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg) scale(1.03); } }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 18px 0 2px; }
    .status { color: #a0a4ad; min-height: 18px; margin-top: 4px; text-align: center; padding: 0 20px; }
    .bar {
      width: 190px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .08);
      margin-top: 16px; overflow: hidden; position: relative;
    }
    .fill {
      position: absolute; top: 0; bottom: 0; left: 0; width: 0;
      background: linear-gradient(90deg, #2f7cf6, #8f6bff);
      border-radius: 4px; transition: width .2s ease;
    }
    .bar.indeterminate .fill { width: 40%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
    .version { position: absolute; bottom: 12px; font-size: 11px; color: #5d626d; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="">
    <h1>Bloxcode</h1>
    <div class="status" id="status">Starting…</div>
    <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
    <div class="version" id="version"></div>
  </div>
  <script>
    // Called from the main process via executeJavaScript.
    window.setStatus = function (text, percent) {
      document.getElementById('status').textContent = text;
      const bar = document.getElementById('bar');
      if (typeof percent === 'number') {
        bar.classList.remove('indeterminate');
        document.getElementById('fill').style.width = Math.max(2, Math.min(100, percent)) + '%';
      } else {
        bar.classList.add('indeterminate');
        document.getElementById('fill').style.width = '';
      }
    };
    window.setVersion = function (v) { document.getElementById('version').textContent = 'v' + v; };
  </script>
</body>
</html>
