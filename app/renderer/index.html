<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob: data:">
  <title>Bloxcode</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css">
</head>
<body>
  <div id="titlebar">
    <div class="tb-logo"><img src="../icon.png" alt=""></div>
    <div class="tb-menu">
      <button data-action="quickopen">Go to File… <kbd>Ctrl+P</kbd></button>
      <button data-action="newscript">New Script</button>
    </div>
    <div class="tb-title" id="tb-title">Bloxcode</div>
  </div>

  <div id="main">
    <nav id="activitybar">
      <button class="ab-item active" data-view="explorer" title="Explorer (Ctrl+Shift+E)">
        <svg viewBox="0 0 24 24"><path d="M3 4h7l2 2h9v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="ab-item" data-view="search" title="Search scripts (Ctrl+P)">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="ab-item" data-view="packages" title="Wally Packages">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="ab-item" data-view="claude" title="Code with Claude">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l1.9 6.1 6.1 1.9-6.1 1.9-1.9 6.1-1.9-6.1-6.1-1.9 6.1-1.9zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <button class="ab-item" data-view="plugin" title="Studio Plugin">
        <svg viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M6 7h12v4a6 6 0 0 1-12 0zM12 17v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <aside id="sidebar">
      <section id="view-explorer" class="view active">
        <header class="view-header">
          <span>EXPLORER</span>
          <div class="view-actions">
            <button data-action="newscript" title="New Script">
              <svg viewBox="0 0 16 16"><path d="M9.5 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5zM9.5 1.5V5H13M8 8v4M6 10h4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
            </button>
            <button data-action="refresh" title="Refresh">
              <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <button data-action="collapse" title="Collapse All">
              <svg viewBox="0 0 16 16"><path d="M3 3h10v10H3zM6 8h4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
            </button>
          </div>
        </header>
        <div class="filter-box"><input id="tree-filter" placeholder="Filter explorer…" spellcheck="false"></div>
        <div id="tree-place" class="tree-place"></div>
        <div id="tree" tabindex="0"><div id="tree-spacer"></div></div>
        <div id="tree-empty" class="tree-empty"></div>
      </section>

      <section id="view-packages" class="view">
        <header class="view-header"><span>WALLY PACKAGES</span></header>
        <div class="filter-box"><input id="pkg-search" placeholder="Search packages (e.g. cmdr, knit, promise)…" spellcheck="false"></div>
        <div class="pkg-scroll">
          <div class="pkg-section-title" id="pkg-installed-title">INSTALLED</div>
          <div id="pkg-installed"></div>
          <div class="pkg-section-title" id="pkg-results-title">POPULAR</div>
          <div id="pkg-results"></div>
        </div>
      </section>

      <section id="view-claude" class="view">
        <header class="view-header">
          <span>CLAUDE</span>
          <div class="view-actions">
            <button id="chat-new" title="New chat">
              <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <button id="chat-settings" title="Connection settings">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </header>
        <div id="chat-setup" class="plugin-panel hidden"></div>
        <div id="chat-log" class="hidden"></div>
        <form id="chat-form" class="hidden">
          <textarea id="chat-input" rows="3" placeholder="Tell Claude what to build…" spellcheck="false"></textarea>
          <div class="chat-bar">
            <span id="chat-mode"></span>
            <button type="button" id="chat-stop" class="hidden">Stop</button>
            <button type="submit" id="chat-send">Send</button>
          </div>
        </form>
      </section>

      <section id="view-plugin" class="view">
        <header class="view-header"><span>STUDIO PLUGIN</span></header>
        <div class="plugin-panel" id="plugin-panel"></div>
      </section>
    </aside>
    <div id="sash"></div>

    <section id="editor-area">
      <div id="tabs"></div>
      <div id="breadcrumbs"></div>
      <div id="editor"></div>
      <div id="welcome">
        <div class="welcome-inner">
          <img src="../icon.png" alt="" class="welcome-logo">
          <h1>Bloxcode</h1>
          <p class="sub">External code editor for Roblox Studio</p>
          <div id="welcome-status" class="welcome-status"></div>
          <div class="shortcuts">
            <div><span>Open script</span><kbd>Ctrl</kbd><kbd>P</kbd></div>
            <div><span>Save / send to Studio</span><kbd>Ctrl</kbd><kbd>S</kbd></div>
            <div><span>Close tab</span><kbd>Ctrl</kbd><kbd>W</kbd></div>
            <div><span>Next tab</span><kbd>Ctrl</kbd><kbd>Tab</kbd></div>
            <div><span>Insert object</span><span class="hint">Right-click in Explorer</span></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer id="statusbar">
    <div class="sb-left">
      <span id="sb-conn" class="sb-item"></span>
      <span id="sb-sync" class="sb-item"></span>
      <span id="sb-agent" class="sb-item clickable agent" title="Claude is working on your place"></span>
    </div>
    <div class="sb-right">
      <span id="sb-update" class="sb-item clickable update"></span>
      <span id="sb-pos" class="sb-item"></span>
      <span class="sb-item" id="sb-indent">Tabs: 4</span>
      <span class="sb-item">UTF-8</span>
      <span class="sb-item">Luau</span>
      <span id="sb-autosync" class="sb-item clickable" title="Send changes to Studio automatically"></span>
    </div>
  </footer>

  <div id="quick" class="hidden">
    <input id="quick-input" spellcheck="false">
    <div id="quick-msg"></div>
    <div id="quick-list"></div>
  </div>
  <div id="ctxmenu" class="hidden"></div>
  <div id="toasts"></div>

  <script src="icons.js"></script>
  <script src="luau.js"></script>
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
